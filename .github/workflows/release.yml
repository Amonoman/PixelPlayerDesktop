name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "alpha"
        type: choice
        options:
          - alpha
          - stable

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute version and metadata
        id: meta
        run: |
          BASE_VERSION="$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            VER_NAME="${TAG_NAME#v}"
            if [[ "$VER_NAME" == *-* ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          elif [[ "${{ inputs.release_type }}" == "stable" ]]; then
            VER_NAME="$BASE_VERSION"
            TAG_NAME="v$VER_NAME"
            IS_PRERELEASE="false"
          else
            VER_NAME="${BASE_VERSION}-alpha.${{ github.run_number }}"
            TAG_NAME="v$VER_NAME"
            IS_PRERELEASE="true"
          fi

          echo "version=$VER_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Install libmpv dependencies & RPM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev mpv rpm

      - name: Build Linux Distribution
        run: ./gradlew packageDeb packageRpm createDistributable "-PAPP_VERSION_NAME=${{ steps.meta.outputs.version }}" --no-daemon

      - name: Archive Portable Linux Binary
        run: |
          tar -czf build/compose/binaries/main/pixelplayer-linux-portable.tar.gz -C build/compose/binaries/main/app pixelplayer

      - name: Stage Linux Artifacts
        run: |
          mkdir -p dist-linux
          find build/compose/binaries/main -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.tar.gz" \) -exec cp {} dist-linux/ \;

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist-linux/*
          retention-days: 1

  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest
    needs: build-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build Windows Distribution
        run: .\gradlew.bat packageExe createDistributable "-PAPP_VERSION_NAME=${{ needs.build-linux.outputs.version }}" --no-daemon

      - name: Archive Portable Windows Binary
        shell: pwsh
        run: |
          Compress-Archive -Path "build\compose\binaries\main\app\pixelplayer\*" -DestinationPath "build\compose\binaries\main\pixelplayer-windows-portable.zip"

      - name: Stage Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-windows"
          Copy-Item "build/compose/binaries/main/exe/*.exe" "dist-windows/"
          Copy-Item "build/compose/binaries/main/pixelplayer-windows-portable.zip" "dist-windows/"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist-windows/*
          retention-days: 1

  build-macos:
    name: Build macOS Packages
    runs-on: macos-latest
    needs: build-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Install libmpv dependencies
        run: brew install mpv

      - name: Build macOS Distribution
        run: ./gradlew packageDmg createDistributable "-PAPP_VERSION_NAME=${{ needs.build-linux.outputs.version }}" --no-daemon --stacktrace

      - name: Dump jpackage logs on failure
        if: failure()
        run: |
          for f in $(find build/compose/logs -type f 2>/dev/null); do
            echo "==================== $f ===================="
            cat "$f"
          done

      - name: Archive Portable macOS Binary
        run: |
          APP_NAME=$(ls build/compose/binaries/main/app | grep '\.app$' | head -n 1)
          tar -czf build/compose/binaries/main/pixelplayer-macos-portable.tar.gz -C build/compose/binaries/main/app "$APP_NAME"

      - name: Stage macOS Artifacts
        run: |
          mkdir -p dist-macos
          find build/compose/binaries/main -type f \( -name "*.dmg" -o -name "*macos-portable.tar.gz" \) -exec cp {} dist-macos/ \;

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist-macos/*
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Release Notes
        env:
          RELEASE_TAG: ${{ needs.build-linux.outputs.tag }}
        run: |
          python3 -c '
          import subprocess, os

          prev_tag = ""
          try:
              tags = subprocess.check_output(["git", "tag", "--sort=-creatordate"]).decode("utf-8").strip().splitlines()
              current_tag = os.environ.get("RELEASE_TAG", "")
              for t in tags:
                  if t != current_tag:
                      prev_tag = t
                      break
          except Exception:
              pass

          cmd = ["git", "log"]
          if prev_tag:
              cmd.append(f"{prev_tag}..HEAD")
          cmd.append("--pretty=format:%h|%s")

          try:
              out = subprocess.check_output(cmd).decode("utf-8")
          except Exception:
              out = ""

          features, fixes, maintenance = [], [], []
          repo_url = os.environ.get("GITHUB_SERVER_URL", "https://github.com") + "/" + os.environ.get("GITHUB_REPOSITORY", "adlifarizi/PixelPlayerDesktop")

          for line in out.strip().split("\n"):
              if not line: continue
              parts = line.split("|", 1)
              if len(parts) != 2: continue
              h, s = parts[0].strip(), parts[1].strip()
              link = f"[{h}]({repo_url}/commit/{h})"

              lower = s.lower()
              if lower.startswith("feat"):
                  clean = s.split(":", 1)[1].strip() if ":" in s else s
                  features.append(f"- **{clean}** ({link})")
              elif lower.startswith("fix"):
                  clean = s.split(":", 1)[1].strip() if ":" in s else s
                  fixes.append(f"- {clean} ({link})")
              elif lower.startswith("refactor") or lower.startswith("build") or lower.startswith("perf") or lower.startswith("chore") or lower.startswith("docs"):
                  clean = s.split(":", 1)[1].strip() if ":" in s else s
                  maintenance.append(f"- {clean} ({link})")
              else:
                  maintenance.append(f"- {s} ({link})")

          body_parts = []
          if features:
              body_parts.append("### Features & Enhancements\n" + "\n".join(features))
          if fixes:
              body_parts.append("### Bug Fixes\n" + "\n".join(fixes))
          if maintenance:
              body_parts.append("### Build & Maintenance\n" + "\n".join(maintenance))

          if not body_parts:
              body_parts.append("### Changes\n" + (out if out else "- Maintenance and bug fixes"))

          full_body = "\n\n".join(body_parts) + "\n"
          with open("release-notes.md", "w") as f:
              f.write(full_body)
          '

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: release-assets

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-dist
          path: release-assets

      - name: Display Release Files
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-linux.outputs.tag }}
          name: "PixelPlayer Desktop ${{ needs.build-linux.outputs.version }}"
          body_path: release-notes.md
          prerelease: ${{ needs.build-linux.outputs.is_prerelease == 'true' }}
          draft: true
          generate_release_notes: false
          files: release-assets/*
