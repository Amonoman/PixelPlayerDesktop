name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "alpha"
        type: choice
        options:
          - alpha
          - stable

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute version and metadata
        id: meta
        run: |
          BASE_VERSION="$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            VER_NAME="${TAG_NAME#v}"
            if [[ "$VER_NAME" == *-* ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          elif [[ "${{ inputs.release_type }}" == "stable" ]]; then
            VER_NAME="$BASE_VERSION"
            TAG_NAME="v$VER_NAME"
            IS_PRERELEASE="false"
          else
            VER_NAME="${BASE_VERSION}-alpha.${{ github.run_number }}"
            TAG_NAME="v$VER_NAME"
            IS_PRERELEASE="true"
          fi

          echo "version=$VER_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Install libmpv dependencies & RPM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev mpv rpm

      - name: Build Linux Distribution
        run: ./gradlew packageDeb packageRpm createDistributable "-PAPP_VERSION_NAME=${{ steps.meta.outputs.version }}" --no-daemon

      - name: Archive Portable Linux Binary
        run: |
          tar -czf build/compose/binaries/main/pixelplayer-linux-portable.tar.gz -C build/compose/binaries/main/app pixelplayer

      - name: Stage Linux Artifacts
        run: |
          mkdir -p dist-linux
          find build/compose/binaries/main -type f \( -name "*.deb" -o -name "*.rpm" -o -name "*.tar.gz" \) -exec cp {} dist-linux/ \;

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist-linux/*
          retention-days: 1

  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest
    needs: build-linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build Windows Distribution
        run: .\gradlew.bat packageMsi packageExe createDistributable "-PAPP_VERSION_NAME=${{ needs.build-linux.outputs.version }}" --no-daemon

      - name: Archive Portable Windows Binary
        shell: pwsh
        run: |
          Compress-Archive -Path "build\compose\binaries\main\app\pixelplayer\*" -DestinationPath "build\compose\binaries\main\pixelplayer-windows-portable.zip"

      - name: Stage Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-windows"
          Copy-Item "build/compose/binaries/main/msi/*.msi" "dist-windows/"
          Copy-Item "build/compose/binaries/main/exe/*.exe" "dist-windows/"
          Copy-Item "build/compose/binaries/main/pixelplayer-windows-portable.zip" "dist-windows/"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist-windows/*
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-dist
          path: release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-dist
          path: release-assets

      - name: Display Release Files
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-linux.outputs.tag }}
          name: "PixelPlayer Desktop ${{ needs.build-linux.outputs.version }}"
          prerelease: ${{ needs.build-linux.outputs.is_prerelease == 'true' }}
          draft: false
          generate_release_notes: true
          files: release-assets/*
